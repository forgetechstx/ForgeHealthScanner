name: Build, test and unsigned release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build and package the portable EXE
        shell: powershell
        run: ./build/Package.ps1 -OutputDirectory dist/release -RequireCleanSource
      - name: Meaningful regression and portable integration tests
        shell: powershell
        run: ./build/Test-All.ps1
      - name: Validate release tag
        id: version
        shell: powershell
        run: |
          $version = ([version](Get-Item dist/native/HealthScan.exe).VersionInfo.FileVersion).ToString(3)
          "stem=ForgeHealthScanner-$version-portable-unsigned" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and binary version differ' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-release
          path: |
            dist/release/${{ steps.version.outputs.stem }}.zip
            dist/release/${{ steps.version.outputs.stem }}.cdx.json
            dist/release/${{ steps.version.outputs.stem }}.manifest.json
            dist/release/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: github.ref == 'refs/heads/main'
        with:
          path: site
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download tested release artifact
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name unsigned-release --dir dist
      - name: Revalidate bytes and publish unsigned release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./build/Test-Package.ps1 -Directory dist
          $stem = "dist/ForgeHealthScanner-$($env:GITHUB_REF_NAME.Substring(1))-portable-unsigned"
          gh release create $env:GITHUB_REF_NAME "$stem.zip" "$stem.cdx.json" "$stem.manifest.json" dist/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --verify-tag --title "ForgeHealthScanner $env:GITHUB_REF_NAME (unsigned)" --notes-file docs/RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
  pages:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed static website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
